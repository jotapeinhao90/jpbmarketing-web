<title>Mi barbería — JPB</title>
<style>
  :root {
    --bg:#f4f1ec;--card:#fff;--border:#ebe5db;--text:#1b2430;--suave:#7a7468;
    --navy:#0f2236;--navy-2:#17324f;--laton:#b8893b;--laton-claro:#d9b26a;
    --ok:#1f8a5b;--ok-bg:#e8f4ee;--bad:#c0392b;--bad-bg:#f9e9e7;
    --warn:#8a672d;--warn-bg:#f6efe0;--sombra:0 1px 2px rgba(15,34,54,.04),0 10px 28px rgba(15,34,54,.06);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
  button,input,select,textarea{font:inherit;color:inherit}button{touch-action:manipulation}
  .app{display:grid;grid-template-columns:240px 1fr;min-height:100vh;transition:opacity .22s ease}
  aside{background:#fff;border-right:1px solid var(--border);padding:22px 16px;position:sticky;top:0;height:100vh}
  .marca{display:flex;align-items:center;gap:11px;padding:4px 8px 24px}.marca .logo,.login .logo{display:grid;place-items:center;background:var(--navy)}
  .marca .logo{width:42px;height:42px;border-radius:13px}.marca b{display:block;font:700 17px/1.15 "Plus Jakarta Sans",system-ui,sans-serif;letter-spacing:-.01em}.marca small{color:var(--suave);font-size:11.5px}
  .nav-item{display:flex;align-items:center;gap:11px;width:100%;min-height:46px;padding:6px 10px;border:0;background:none;color:var(--suave);border-radius:12px;cursor:pointer;font-weight:600;margin-bottom:4px;text-align:left;transition:background-color .14s,color .14s}
  .nav-item .ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--bg);color:var(--navy)}
  .nav-item.activo{background:var(--navy);color:#fff}.nav-item.activo .ico{background:rgba(255,255,255,.11);color:#fff}
  main{min-width:0}header.top{background-color:var(--navy);background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.03) 0 1px,transparent 1px 14px);color:#fff;padding:24px 28px 66px;box-shadow:inset 0 -1px 0 rgba(184,137,59,.6)}
  .top-row{display:flex;align-items:center;justify-content:space-between;gap:12px}.top h1{margin:2px 0 0;font-size:28px;line-height:1.15;font-weight:700;letter-spacing:-.02em}.top .saludo{color:rgba(255,255,255,.72);font-size:13px}.modo-etiqueta{display:flex;align-items:center;gap:6px;min-height:18px;margin-top:5px;color:rgba(255,255,255,.68);font-size:12px}
  .top-acciones{display:flex;align-items:center;gap:10px}.avatar-top{width:42px;height:42px;border-radius:50%;background:#1a3857;color:#fff;display:grid;place-items:center;font-weight:700;border:2px solid var(--laton);flex:none}.modo-control{display:flex;align-items:center;padding:3px;border:1px solid rgba(255,255,255,.2);border-radius:12px;background:rgba(255,255,255,.08);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}.modo-control button{min-width:62px;min-height:40px;padding:7px 11px;border:0;border-radius:9px;background:transparent;color:rgba(255,255,255,.76);font-size:12px;font-weight:700;cursor:pointer}.modo-control button[aria-pressed="true"]{background:var(--bg);color:var(--navy);box-shadow:0 2px 8px rgba(0,0,0,.12)}.punto-vivo{width:7px;height:7px;border-radius:50%;background:#48c78e;box-shadow:0 0 0 0 rgba(72,199,142,.45);display:inline-block;flex:none}.modo-control .punto-vivo{display:none;margin-right:5px}.modo-control button[aria-pressed="true"] .punto-vivo,.modo-etiqueta .punto-vivo{display:inline-block;animation:pulso-vivo 2s ease-out infinite}@keyframes pulso-vivo{0%,55%{box-shadow:0 0 0 0 rgba(72,199,142,.42)}100%{box-shadow:0 0 0 6px rgba(72,199,142,0)}}
  .contenido{position:relative;z-index:1;padding:0 24px 110px;margin-top:-40px}.contenido>section{max-width:1100px;margin:0 auto}
  .tarjeta{background:#fff;border:1px solid var(--border);border-radius:20px;box-shadow:var(--sombra);padding:18px}
  .titulo-seccion{display:flex;align-items:center;gap:9px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--suave);margin:24px 4px 11px}.titulo-seccion::before{content:"";width:16px;height:2px;border-radius:2px;background:var(--laton);flex:none}
  .grid-kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}.kpi{display:flex;align-items:center;gap:12px}.kpi .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}.kpi .val{font-size:26px;font-weight:700;line-height:1.08;letter-spacing:-.02em}.kpi .lbl{color:var(--suave);font-size:12.5px;margin-top:4px}
  .ic-navy{background:#e9eef3;color:var(--navy)}.ic-naranja,.ic-ambar{background:var(--warn-bg);color:var(--laton)}.ic-verde{background:var(--ok-bg);color:var(--ok)}.ic-rojo{background:var(--bad-bg);color:var(--bad)}
  .lista{display:flex;flex-direction:column;gap:8px}.item{display:flex;align-items:center;gap:12px;background:#fff;border-radius:16px;padding:12px 14px;box-shadow:var(--sombra);cursor:pointer;border:1px solid var(--border);transition:border-color .14s,transform .14s}.item:hover{border-color:#d9ccb7}.item:active{transform:scale(.99)}
  .circ{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;flex:none;font-size:15px}.item .info{min-width:0;flex:1}.item .nombre{font-weight:700;display:flex;gap:6px;flex-wrap:wrap;align-items:center}.item .detalle{color:var(--suave);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item .derecha{text-align:right;flex:none}.item .hora{color:var(--suave);font-size:12px}
  .pill{display:inline-block;font-size:11px;padding:4px 9px;border-radius:999px;font-weight:700}.pill.ok{background:var(--ok-bg);color:#176d48}.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.warn{background:var(--warn-bg);color:#745823}.pill.info{background:#e9eef3;color:var(--navy)}
  .btn{min-height:44px;background:linear-gradient(155deg,var(--navy-2),var(--navy));color:#fff;border:0;border-radius:14px;padding:10px 17px;cursor:pointer;font-weight:700;transition:filter .14s,transform .14s}.btn:hover{filter:brightness(1.08)}.btn:active{transform:scale(.98)}.btn.sec{background:#fff;color:var(--navy);border:1px solid var(--border)}.btn:disabled{opacity:.5;cursor:default}.btn.peq{min-height:38px;padding:7px 12px;font-size:12px}.vacio{text-align:center;color:var(--suave);padding:36px 10px}.vacio .empty-icon{width:48px;height:48px;border-radius:15px;background:#ebe7df;color:var(--navy);display:grid;place-items:center;margin:0 auto 12px}
  .hilo-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}.hilo-head .nombre-grande,.hoja .cab .nombre-grande{font-size:18px;font-weight:700;letter-spacing:-.02em}.hilo-head .tel{color:var(--suave);font-size:13px}.volver{min-height:44px;background:none;border:0;color:var(--navy);font-weight:700;cursor:pointer;padding:0 4px 10px}
  .chat{display:flex;flex-direction:column;gap:8px;padding:14px;background:#faf8f4;border:1px solid var(--border);border-radius:20px;box-shadow:var(--sombra);min-height:260px;max-height:60vh;overflow-y:auto}.burbuja{max-width:78%;padding:10px 14px;border-radius:18px 18px 18px 6px;background:#fff;border:1px solid var(--border);white-space:pre-wrap;overflow-wrap:anywhere}.burbuja.out{align-self:flex-end;background:#12304d;color:#fff;border-color:#12304d;border-radius:18px 18px 6px 18px}.burbuja.plantilla{background:#f6efe0;color:#5b4a22;border-color:#e8d5ac}.burbuja .hora-b{display:block;font-size:11px;opacity:.64;margin-top:4px;text-align:right}
  .dia-sep{align-self:center;font-size:11.5px;color:var(--suave);background:#ebe7df;padding:4px 12px;border-radius:999px;margin:6px 0 2px;font-weight:600}
  .bot-barra{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--border);border-radius:16px;padding:10px 12px;margin-bottom:10px;font-size:13.5px}.bot-barra .estado-icono{width:36px;height:36px;border-radius:11px;background:#e9eef3;color:var(--navy);display:grid;place-items:center;flex:none}.bot-barra .quien{flex:1;min-width:0}.bot-barra b{display:block;font-size:13.5px}.bot-barra small{color:var(--suave)}.bot-barra.humano{background:var(--warn-bg);border-color:#e8d5ac}.bot-barra.humano .estado-icono{background:#ead9b7;color:#6f5220}
  .redactor{margin-top:12px}.rapidas{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}.rapidas::-webkit-scrollbar,.chips::-webkit-scrollbar{display:none}.rapidas button,.chip{flex:none;min-height:44px;border:1px solid var(--border);background:#fff;border-radius:999px;padding:8px 14px;font-size:12.5px;color:var(--navy);font-weight:600;cursor:pointer}.redactor .fila-envio{display:flex;gap:10px;align-items:flex-end}.redactor textarea{flex:1;resize:none;border-radius:18px;border:1px solid var(--border);background:#fff;padding:12px 15px;min-height:48px;max-height:140px;font-size:15.5px}.redactor .enviar{width:48px;height:48px;border-radius:50%;border:0;background:var(--navy);color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 6px 16px rgba(15,34,54,.2);flex:none}.redactor .enviar:disabled,.redactor textarea:disabled{opacity:.5;cursor:default}
  input:focus,textarea:focus,.buscar:focus,.campo:focus{outline:2px solid rgba(184,137,59,.32);border-color:var(--laton)}
  .frase-card{position:relative;overflow:hidden;background-color:var(--navy);background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.03) 0 1px,transparent 1px 14px);color:#fff;border-radius:20px;padding:16px 22px;margin-bottom:14px;box-shadow:0 12px 30px rgba(15,34,54,.18);cursor:pointer;border:1px solid rgba(217,178,106,.18)}.frase-card .comillas{position:absolute;right:18px;top:12px;width:54px;height:38px;color:rgba(184,137,59,.28);pointer-events:none}.frase-card .tag{position:relative;display:flex;align-items:center;gap:7px;letter-spacing:.14em;font-size:11px;font-weight:600;text-transform:uppercase;color:var(--laton-claro);margin-bottom:7px}.frase-card .txt{position:relative;font:600 21px/1.35 "Plus Jakarta Sans",system-ui,sans-serif;letter-spacing:-.01em;max-width:39ch;padding-right:32px}.frase-card .pie{position:relative;margin-top:7px;font-size:12px;color:rgba(255,255,255,.6)}
  .tabbar{display:none}.login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg)}.login{width:100%;max-width:390px;background:#fff;border:1px solid var(--border);border-radius:24px;padding:32px 28px;box-shadow:0 18px 52px rgba(15,34,54,.12);text-align:center}.login .logo{width:60px;height:60px;border-radius:18px;margin:0 auto 16px}.login h2{margin:0 0 6px;font:700 30px/1.2 "Plus Jakarta Sans",system-ui,sans-serif;letter-spacing:-.02em}.login p{color:var(--suave);margin:0 0 18px;font-size:14px}.login input{width:100%;min-height:48px;padding:12px 14px;border-radius:14px;border:1px solid var(--border);background:#faf8f4;margin-bottom:12px}.login .btn{width:100%}.login .frase{margin:16px 5px 18px;font:600 14px/1.5 "Plus Jakarta Sans",system-ui,sans-serif;color:#625b50}.error{color:var(--bad);font-size:13px;min-height:18px;margin-top:8px}.oculto{display:none!important}
  .chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin:0 -2px 12px;scrollbar-width:none}.chip.activo{background:var(--navy);color:#fff;border-color:var(--navy)}.buscar{width:100%;min-height:48px;padding:12px 14px;border-radius:14px;border:1px solid var(--border);background:#fff;margin-bottom:12px}
  .meta-linea{margin:16px 0 4px}.meta-linea .fila{display:flex;justify-content:space-between;gap:12px;font-size:13px;font-weight:600;margin-bottom:7px}.meta-linea .fila span:last-child{color:var(--suave)}.barra{height:10px;border-radius:999px;background:#ece7df;overflow:hidden}.barra i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--laton),var(--laton-claro));transition:width .14s ease}.barra i.cumplida{background:var(--ok)}.meta-cumplida{display:flex;align-items:center;gap:6px;color:var(--ok);font-size:12.5px;font-weight:700;margin-top:7px}
  .semanas{display:flex;align-items:flex-end;gap:10px;height:110px;margin-top:6px}.semanas .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}.semanas .par{display:flex;align-items:flex-end;gap:3px;height:82px}.semanas .par i{width:12px;border-radius:5px 5px 2px 2px;min-height:3px;display:block}.semanas small{font-size:11px;color:var(--suave)}.leyenda{display:flex;gap:14px;font-size:12px;color:var(--suave);margin-top:8px}.leyenda b{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
  .canje-box{max-width:520px;margin:0 auto;text-align:center}.canje-icono{width:60px;height:60px;border-radius:18px;background:var(--warn-bg);color:var(--laton);display:grid;place-items:center;margin:0 auto 10px}.canje-box h2{margin:6px 0 5px;font-size:24px;letter-spacing:-.02em}.canje-box .campo{width:100%;padding:18px;font-size:22px;font-weight:700;letter-spacing:.04em;text-align:center;text-transform:uppercase;border-radius:18px;border:1px solid var(--border);background:#fff}.canje-box p{color:var(--suave);margin:4px 0 16px}
  .resultado{margin-top:16px;border-radius:18px;padding:18px;text-align:left}.resultado.ok{background:var(--ok-bg)}.resultado.bad{background:var(--bad-bg)}.resultado h3{margin:0 0 4px;font-size:18px}.resultado.ok h3{color:var(--ok)}.resultado.bad h3{color:var(--bad)}.resultado .desc{font-size:28px;font-weight:700;color:var(--ok);margin:6px 0}
  .fila-ciclo{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--border)}.fila-ciclo:first-of-type{border-top:0}.fila-ciclo .per{font-weight:700}.fila-ciclo .sub{color:var(--suave);font-size:12.5px}.fila-ciclo .monto{font-weight:700;text-align:right}.dato{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-top:1px solid var(--border)}.dato:first-of-type{border-top:0}.dato span:first-child{color:var(--suave)}
  .aviso,.aviso-ventana{background:var(--warn-bg);color:#5b4a22;border:1px solid #e8d5ac;border-radius:14px;padding:11px 14px;font-size:13px;margin-bottom:10px}.aviso{font-size:13.5px;margin-bottom:14px}
  .hoja-fondo{position:fixed;inset:0;background:rgba(15,34,54,.48);z-index:50;display:flex;align-items:flex-end;justify-content:center}.hoja{background:var(--bg);width:100%;max-width:520px;max-height:90vh;overflow-y:auto;border-radius:24px 24px 0 0;padding:20px 18px 28px;box-shadow:0 -10px 40px rgba(0,0,0,.18)}.hoja .cab{display:flex;align-items:center;gap:12px;margin-bottom:12px}.hoja .acc{display:flex;gap:8px;margin:14px 0 4px;flex-wrap:wrap}.linea-tiempo{border-left:2px solid var(--border);margin:12px 0 0 8px;padding-left:16px}.linea-tiempo .ev{position:relative;padding-bottom:14px;font-size:14px}.linea-tiempo .ev::before{content:"";position:absolute;left:-23px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--laton)}.linea-tiempo .ev.ok::before{background:var(--ok)}.linea-tiempo .ev.bad::before{background:var(--bad)}.linea-tiempo small{display:block;color:var(--suave)}

  @media(max-width:860px){
    .app{grid-template-columns:1fr}aside{display:none}header.top{padding:19px 18px 58px}.top h1{font-size:24px}.contenido{padding:0 14px 110px}.tabbar{display:flex;position:fixed;bottom:10px;left:10px;right:10px;background:rgba(255,255,255,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(235,229,219,.9);border-radius:20px;box-shadow:0 10px 30px rgba(15,34,54,.16);padding:7px;padding-bottom:calc(7px + env(safe-area-inset-bottom));z-index:10}.tabbar button{flex:1;min-height:50px;border:0;background:none;color:var(--suave);padding:6px 3px;border-radius:14px;cursor:pointer;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}.tabbar button.activo{background:var(--navy);color:#fff}.hero{gap:4px}.ring svg{width:88px;height:88px}.ring-val{top:29px;font-size:18px}.ring-lbl{font-size:11.5px;text-align:center}.chat{max-height:52vh}.burbuja{max-width:86%}
    body.en-hilo .tabbar{display:none}body.en-hilo .contenido{padding-bottom:8px}body.en-hilo .hilo-wrap{display:flex;flex-direction:column;height:calc(100dvh - 98px);padding-bottom:env(safe-area-inset-bottom)}body.en-hilo .hilo-wrap>*{flex:none}body.en-hilo .hilo-wrap>.chat{flex:1 1 auto;min-height:90px;max-height:none}.hilo-wrap>.volver:first-child{margin-top:62px;align-self:flex-start}.redactor{padding-top:4px}.aviso-ventana{font-size:12.5px;padding:9px 12px}

  body:not(.sesion) .tabbar{display:none!important}

  :root{--card-grad:linear-gradient(145deg,rgba(255,255,255,.98),rgba(250,247,241,.94));--ease:cubic-bezier(.2,.8,.2,1)}
  body{background-color:var(--bg);background-image:radial-gradient(circle at 15% 15%,rgba(184,137,59,.035) 0 1px,transparent 1.5px);background-size:13px 13px}
  button,.item,.frase-card{ -webkit-tap-highlight-color:transparent}
  button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,.item:focus-visible{outline:3px solid rgba(217,178,106,.55);outline-offset:2px}
  aside{background:rgba(255,255,255,.88);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);overflow:hidden}
  aside nav{position:relative}.nav-item{position:relative;z-index:1;transition:color .25s var(--ease),transform .25s var(--ease);min-height:48px}
  .nav-item.activo{background:transparent;color:#fff}.nav-indicador{position:absolute;left:8px;right:8px;height:48px;border-radius:14px;background:var(--navy);box-shadow:0 8px 20px rgba(15,34,54,.18);transition:transform .5s cubic-bezier(.2,1.2,.25,1);pointer-events:none}
  header.top{position:relative;isolation:isolate;overflow:hidden;background-color:var(--navy);background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.025) 0 1px,transparent 1px 15px);background-position:0 var(--aurora-y,0);padding-top:28px}

<script>
(() => {
  const CLAVE_KEY = "barberiaAcceso";
  const MODO_KEY = "barberiaModo";
  const COLORES = ["#0f2236", "#b8893b", "#356b73", "#56647a", "#8a672d", "#1f8a5b", "#c0392b", "#315d85"];
  const TITULOS = { resumen: "Resumen", clientes: "Clientes", chats: "Conversaciones", facturacion: "Facturación" };
  const $ = (id) => document.getElementById(id);
  let acceso = "";
  let yo = null;
  let vistaActual = "resumen";
  let clientes = [];
  let filtro = "todos";
  let busqueda = "";
  let modo = "demo";
  try { modo = localStorage.getItem(MODO_KEY) === "real" ? "real" : "demo"; } catch (e) {}
  let resumenFirma = "";
  let cargaVersion = 0;
  let vistaObserver = null;
  let listaObserver = null;
  let animacionesFrame = 0;
  let conteosActivos = [];
  let nivelAnterior = null;
  let ultimoPunto = { x: innerWidth / 2, y: innerHeight };
  const valoresVivos = new Map();
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)");

  const limpiarAnimaciones = () => {
    if (vistaObserver) vistaObserver.disconnect();
    if (listaObserver) listaObserver.disconnect();
    vistaObserver = null;
    listaObserver = null;
    cancelAnimationFrame(animacionesFrame);
    animacionesFrame = 0; // si no se reinicia, contar() cree que ya hay una animación corriendo y los números se quedan en 0
    conteosActivos = [];
  };
  const vibrar = () => { if (!reduceMotion.matches && navigator.vibrate) navigator.vibrate(8); };
  const contar = (el) => {
    if (!el || el.dataset.contado) return;
    el.dataset.contado = "1";
    const final = Number(el.dataset.count);
    const claveValor = el.dataset.valueKey;
    if (claveValor) {
      const anterior = valoresVivos.get(claveValor);
      if (modo === "real" && anterior != null && anterior !== final) el.classList.add("valor-cambio");
      valoresVivos.set(claveValor, final);
    }
    if (!Number.isFinite(final) || reduceMotion.matches) { el.textContent = final.toLocaleString("es-CL"); return; }
    conteosActivos.push({ el, final, inicio: performance.now() });
    if (animacionesFrame) return;
    const paso = (ahora) => {
      conteosActivos = conteosActivos.filter((job) => {
        if (!job.el.isConnected) return false;
        const p = Math.min(1, (ahora - job.inicio) / 900), ease = 1 - Math.pow(1 - p, 3);
        job.el.textContent = Math.round(job.final * ease).toLocaleString("es-CL");
        return p < 1;
      });
      animacionesFrame = conteosActivos.length ? requestAnimationFrame(paso) : 0;
    };
    animacionesFrame = requestAnimationFrame(paso);
  };
  const activarAnimaciones = (raiz) => {
    limpiarAnimaciones();
    const nodos = [...raiz.querySelectorAll(".tarjeta,.canje-reciente")].slice(0, 12);
    nodos.forEach((el, i) => { el.classList.add("revelar"); el.style.animationDelay = `${i * 50}ms`; });
    const observables = raiz.querySelectorAll("[data-count],.meta-ring .progreso,.escala-fill");
    vistaObserver = new IntersectionObserver((entradas) => entradas.forEach((e) => {
      if (!e.isIntersecting) return;
      if (e.target.dataset.count != null) contar(e.target);
      if (e.target.classList.contains("progreso")) e.target.style.strokeDashoffset = e.target.dataset.offset;
      if (e.target.classList.contains("escala-fill")) e.target.style.width = `${e.target.dataset.width}%`;
      vistaObserver.unobserve(e.target);
    }), { threshold: .25 });
    observables.forEach((el) => vistaObserver.observe(el));
    listaObserver = new IntersectionObserver((entradas) => entradas.forEach((e) => {
      if (!e.isIntersecting) return;
      e.target.classList.add("lista-visible");
      e.target.style.animationDelay = `${Math.min(Number(e.target.dataset.orden || 0), 8) * 45}ms`;
      listaObserver.unobserve(e.target);
    }), { threshold: .12 });
    raiz.querySelectorAll(".lista .item,.fila-ciclo").forEach((el, i) => { el.dataset.orden = i; listaObserver.observe(el); });
    activarSpotlight(raiz);
    // Seguro de cifras: si por cualquier motivo la animación de conteo no corrió, se muestra el valor final.
    setTimeout(() => raiz.querySelectorAll("[data-count]:not([data-contado])").forEach((el) => {
      const final = Number(el.dataset.count);
      if (Number.isFinite(final)) { el.dataset.contado = "1"; el.textContent = final.toLocaleString("es-CL"); }
    }), 2200);
    setTimeout(() => raiz.querySelectorAll("[data-count][data-contado]").forEach((el) => {
      const final = Number(el.dataset.count);
      if (Number.isFinite(final) && el.textContent.replace(/\./g, "") !== String(final) && !conteosActivos.some((j) => j.el === el)) el.textContent = final.toLocaleString("es-CL");
    }), 2600);
    // Red de seguridad: nada de esto debe quedarse invisible si el observador no alcanza a dispararse.
    setTimeout(() => raiz.querySelectorAll(".lista .item:not(.lista-visible),.fila-ciclo:not(.lista-visible)").forEach((el) => { el.style.opacity = "1"; }), 2600);
  };

  const escapar = (t) => String(t ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const iniciales = (nombre, tel) => {
    const base = (nombre || "").trim();
    if (!base) return String(tel || "").slice(-2);
    return base.split(/\s+/).slice(0, 2).map((p) => p[0].toUpperCase()).join("");
  };
  const colorPara = (texto) => {
    let h = 0;
    for (const ch of String(texto || "")) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
    return COLORES[h % COLORES.length];
  };
  const clp = (n) => new Intl.NumberFormat("es-CL", { style: "currency", currency: "CLP", maximumFractionDigits: 0 }).format(n || 0);
  const fechaMs = (ts) => (ts ? new Date(ts).toLocaleDateString("es-CL", { day: "numeric", month: "short" }) : "—");
  const fechaIso = (f, conAnio) => (f ? new Date(f + "T12:00:00").toLocaleDateString("es-CL", { day: "numeric", month: "short", ...(conAnio ? { year: "numeric" } : {}) }) : "—");
  const numeroAnimado = (n, extra = "", clave = "") => `<span data-count="${Number(n) || 0}"${clave ? ` data-value-key="${escapar(clave)}"` : ""}>0</span>${extra}`;
  const saludo = () => {
    const h = new Date().getHours();
    return h < 12 ? "Buenos días" : h < 19 ? "Buenas tardes" : "Buenas noches";
  };
  const toast = (msg) => {
    const t = $("toast");
    t.textContent = msg; t.classList.add("on");
    clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("on"), 2600);
  };


  // ---------- Detalles de barbería ----------
  const FRASES = [
    "Un buen corte se recuerda. Un buen trato hace que vuelvan.",
    "Cliente que vuelve vale por diez que llegan una sola vez.",
    "La fidelidad se corta a mano: una visita a la vez.",
    "El mejor anuncio de una barbería es una nuca bien perfilada.",
    "Hoy no solo cortas pelo: construyes confianza.",
    "Recuerda su nombre, recuerda su estilo, y no se irá a otra silla.",
    "Un 10% de descuento hoy es una silla llena mañana.",
    "El que se va contento vuelve en 15 días y trae a un amigo.",
    "Navaja afilada, trato amable, agenda llena.",
    "Fidelizar es agradecer: con un buen corte y buena conversación.",
    "Tu silla tiene dueño: el cliente que ya confía en ti.",
    "Cada código canjeado es un cliente que eligió volver.",
  ];
  let fraseOffset = 0;
  const fraseDelDia = () => {
    const [y, m, d] = new Date().toLocaleDateString("en-CA", { timeZone: "America/Santiago" }).split("-").map(Number);
    const diaDelAnio = Math.floor((Date.UTC(y, m - 1, d) - Date.UTC(y, 0, 0)) / 86400000);
    return FRASES[(diaDelAnio + fraseOffset) % FRASES.length];
  };
  const polo = (tam = 26) => `<svg width="${tam}" height="${tam}" viewBox="0 0 32 32" aria-hidden="true">
    <defs><clipPath id="polo-${tam}"><rect x="10" y="6" width="12" height="20" rx="2"/></clipPath></defs>
    <rect x="9" y="2.5" width="14" height="4" rx="2" fill="#b8893b"/><rect x="9" y="25.5" width="14" height="4" rx="2" fill="#b8893b"/>
    <rect x="10" y="6" width="12" height="20" rx="2" fill="#fff"/>
    <g clip-path="url(#polo-${tam})" fill="#b8893b"><path d="m7 10 18-9v4L7 14z"/><path d="m7 19 18-9v4L7 23z"/><path d="m7 28 18-9v4L7 32z"/></g>
    <rect x="10" y="6" width="12" height="20" rx="2" fill="none" stroke="rgba(15,34,54,.14)"/></svg>`;
  const posteCarga = () => `<span class="poste-carga" aria-hidden="true">${polo(25)}</span>`;
  const comillas = () => `<svg class="comillas" viewBox="0 0 64 44" fill="none" aria-hidden="true"><path d="M6 38c0-14 5-24 16-31l5 6c-6 5-9 10-10 16h10v9H6Zm31 0c0-14 5-24 16-31l5 6c-6 5-9 10-10 16h10v9H37Z" fill="currentColor"/></svg>`;
  const fraseCard = (etiqueta = "Frase del día") => `<div class="frase-card" id="frase-card" title="Toca para ver otra">
    ${comillas()}<div class="tag">${ico("scissors", 14)} ${escapar(etiqueta)}</div><div class="txt">${escapar(fraseDelDia())}</div><div class="pie">Toca para ver otra · Fidelizar es el mejor corte</div></div>`;
  const activarFrase = () => {
    const c = $("frase-card");
    if (c) c.onclick = () => { fraseOffset++; c.classList.remove("cambiando"); void c.offsetWidth; c.classList.add("cambiando"); setTimeout(() => { const t = c.querySelector(".txt"); if (t) t.textContent = fraseDelDia(); }, 190); };
  };
  const decorar = () => document.querySelectorAll("[data-polo]").forEach((el) => { el.innerHTML = polo(Number(el.dataset.polo) || 26); });

  const ICONOS = {
    chart: '<path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/>',
    users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
    check: '<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>',
    star: '<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>',
    ban: '<circle cx="12" cy="12" r="10"/><path d="m4.9 4.9 14.2 14.2"/>',

    const inicio12 = lunesActual - 12 * semanaMs;

  const pushSoportado = () => "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;

  const claveVapid = (b64url) => {

      const reg = await navigator.serviceWorker.ready;
      const { clave } = await api("push/clave");
      const sub = (await reg.pushManager.getSubscription()) || (await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: claveVapid(clave) }));

    }
    vistaActual = nombre;
    document.body.classList.remove("en-hilo");
    if (nombre !== "chats") hiloTel = null;
    ["resumen", "clientes", "chats", "facturacion"].forEach((v) => $("vista-" + v).classList.toggle("oculto", v !== nombre));
    document.querySelectorAll("[data-vista]").forEach((b) => b.classList.toggle("activo", b.dataset.vista === nombre));
    $("titulo").textContent = TITULOS[nombre];
    actualizarIndicadores(nombre);
    window.scrollTo(0, 0);
    const destino = $("vista-" + nombre);
    destino.classList.add("vista-entrando");
    if (nombre === "resumen") destino.innerHTML = `<div class="skeleton skeleton-hero tarjeta"></div><div class="skeleton-grid">${"<div class=\"skeleton skeleton-kpi\"></div>".repeat(4)}</div>`;
    else destino.innerHTML = `<div class="lista">${"<div class=\"skeleton item\" style=\"height:70px\"></div>".repeat(5)}</div>`;
    try {
      await { resumen: vistaResumen, clientes: vistaClientes, chats: vistaChats, facturacion: vistaFacturacion }[nombre]();
      if (version !== cargaVersion) return;
      destino.classList.remove("vista-entrando"); void destino.offsetWidth; destino.classList.add("vista-entrando");
      if (nombre !== "resumen" && nombre !== "clientes" && nombre !== "facturacion") activarAnimaciones(destino);
    } catch (e) {
      if (e.sesion) return cerrarSesion();
      $("vista-" + nombre).innerHTML = `<div class="vacio">No se pudo cargar. ${escapar(e.message)}</div>`;
    }
  }

  async function mostrarApp() {
    yo = await api("yo");
    $("login").classList.add("oculto");
    document.body.classList.add("sesion");
    $("app").classList.remove("oculto");
    indicadoresListos = false;
    actualizarIndicadores(vistaActual, true);
    $("marca-nombre").textContent = yo.nombre;
    $("saludo").textContent = `${saludo()}, ${yo.nombre}`;
    $("avatar").textContent = iniciales(yo.nombre, "B");
    document.title = `${yo.nombre} — JPB`;
    actualizarModoUI();
    const deseada = new URLSearchParams(location.search).get("vista");
    await mostrarVista(["resumen", "clientes", "chats", "facturacion"].includes(deseada) ? deseada : "resumen");
    if (deseada) history.replaceState(null, "", location.pathname);
    document.querySelector(".login-transicion")?.remove();
  }

  function actualizarModoUI() {
    document.querySelectorAll("[data-modo]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.modo === modo)));
    $("modo-etiqueta").innerHTML = modo === "real" ? '<span class="punto-vivo" aria-hidden="true"></span>En vivo · conectado a tu chatbot' : "Datos de demostración";
    document.querySelector(".modo-control").classList.toggle("real", modo === "real");
  }
  async function cambiarModo(nuevoModo) {
    if ((nuevoModo !== "demo" && nuevoModo !== "real") || nuevoModo === modo) return;
    modo = nuevoModo;
    vibrar();
    try { localStorage.setItem(MODO_KEY, modo); } catch (e) {}
    cargaVersion++;
    detenerRefresco();
    cerrarHoja();
    clientes = [];
    filtro = "todos";
    busqueda = "";
    hiloTel = null;
    resumenFirma = "";
    valoresVivos.clear();
    document.body.classList.remove("en-hilo");
    $("app").style.opacity = ".35";
    actualizarModoUI();
    const destino = vistaActual === "chats" ? "chats" : vistaActual;
    try {
      yo = await api("yo");
      $("marca-nombre").textContent = yo.nombre;
      $("saludo").textContent = `${saludo()}, ${yo.nombre}`;
      $("avatar").textContent = iniciales(yo.nombre, "B");
      document.title = `${yo.nombre} — JPB`;
      await mostrarVista(destino);
      $("app").style.opacity = "";
    } catch (e) {
      if (e.sesion) return cerrarSesion();
      $("app").style.opacity = "";
      toast("No se pudo cambiar de modo");
    }
  }
  function cerrarSesion() {
    try { localStorage.removeItem(CLAVE_KEY); } catch (e) {}
    acceso = "";
    location.reload();
  }

  $("entrar").addEventListener("click", async () => {
    acceso = $("clave").value.trim();
    $("errorLogin").textContent = "";
    if (!acceso) return;
    const carga = document.createElement("div"); carga.className = "login-transicion"; carga.innerHTML = `<div>${posteCarga()}<div style="margin-top:12px;font-weight:700">Abriendo tu barbería…</div></div>`; document.body.appendChild(carga);
    try { await mostrarApp(); try { localStorage.setItem(CLAVE_KEY, acceso); } catch (e) {} }
    catch (e) { carga.remove(); acceso = ""; $("errorLogin").textContent = e.sesion ? "Clave incorrecta" : "No se pudo conectar"; $("clave").classList.remove("shake"); void $("clave").offsetWidth; $("clave").classList.add("shake"); }
  });
  $("clave").addEventListener("keydown", (e) => { if (e.key === "Enter") $("entrar").click(); });
  document.querySelectorAll("[data-vista]").forEach((b) => b.addEventListener("click", () => { vibrar(); mostrarVista(b.dataset.vista); }));
  document.querySelectorAll("[data-modo]").forEach((b) => b.addEventListener("click", () => cambiarModo(b.dataset.modo)));
  $("salir").addEventListener("click", cerrarSesion);

  const ICONOS_NAV = { resumen: "chart", clientes: "users", chats: "message", facturacion: "wallet" };
  document.querySelectorAll("[data-vista] .ico").forEach((el) => { el.innerHTML = ico(ICONOS_NAV[el.parentElement.dataset.vista], 18); });
  $("salir").querySelector(".ico").innerHTML = ico("logout", 18);

  const tabIndicador = document.createElement("span"); tabIndicador.className = "tab-indicador"; $("tabbar").prepend(tabIndicador);
  const navIndicador = document.createElement("span"); navIndicador.className = "nav-indicador"; document.querySelector("aside").prepend(navIndicador);
  window.addEventListener("resize", () => actualizarIndicadores(vistaActual, true));
  if (document.fonts?.ready) document.fonts.ready.then(() => actualizarIndicadores(vistaActual, true));
  actualizarIndicadores(vistaActual, true);
  document.addEventListener("pointerdown", (e) => {
    ultimoPunto = { x: e.clientX, y: e.clientY };
    const b = e.target.closest(".btn");
    if (!b || reduceMotion.matches) return;
    const r = b.getBoundingClientRect(), s = document.createElement("span");
    s.className = "ripple"; s.style.left = `${e.clientX - r.left}px`; s.style.top = `${e.clientY - r.top}px`; s.style.width = s.style.height = `${Math.max(r.width, r.height)}px`; b.appendChild(s); setTimeout(() => s.remove(), 600);
  });

  let scrollFrame = 0;
  addEventListener("scroll", () => {
    if (scrollFrame) return;
    scrollFrame = requestAnimationFrame(() => {
      const y = scrollY;
      document.body.classList.toggle("cabecera-compacta", y > 34);
      document.querySelector("header.top")?.style.setProperty("--aurora-y", `${Math.min(y * .09, 18)}px`);
      scrollFrame = 0;
    });
  }, { passive: true });

  const pull = document.createElement("div"); pull.className = "pull-indicador"; pull.innerHTML = `${posteCarga()}<span>Desliza para actualizar</span>`; document.body.appendChild(pull);
  let pullInicio = 0, pullDistancia = 0, pullActivo = false;
  addEventListener("touchstart", (e) => {
    if (!document.body.classList.contains("sesion") || scrollY > 0 || !["resumen", "clientes", "chats"].includes(vistaActual) || hiloTel) return;
    pullInicio = e.touches[0].clientY; pullDistancia = 0; pullActivo = true;
  }, { passive: true });
  addEventListener("touchmove", (e) => {
    if (!pullActivo) return;
    pullDistancia = Math.max(0, Math.min(100, (e.touches[0].clientY - pullInicio) * .6));
    pull.classList.toggle("visible", pullDistancia > 12); pull.querySelector("span").textContent = pullDistancia > 70 ? "Suelta para actualizar" : "Desliza para actualizar";
  }, { passive: true });
  addEventListener("touchend", async () => {
    if (!pullActivo) return; pullActivo = false;
    if (pullDistancia > 70) { pull.classList.add("visible", "cargando"); pull.querySelector("span").textContent = "Actualizando…"; resumenFirma = ""; await mostrarVista(vistaActual); }
    pull.classList.remove("visible", "cargando"); pullDistancia = 0;
  }, { passive: true });

  decorar();
  $("frase-login").textContent = "“" + fraseDelDia() + "”";
  let guardado = "";
  try { guardado = localStorage.getItem(CLAVE_KEY) || ""; } catch (e) {}
  if (guardado) { acceso = guardado; mostrarApp().catch(() => { acceso = ""; $("login").classList.remove("oculto"); }); }
  else $("login").classList.remove("oculto");

  if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
})();

</script>
</body>
</html>
