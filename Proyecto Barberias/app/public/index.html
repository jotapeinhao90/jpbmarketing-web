<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#16324f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mi barbería">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,500&display=swap">
<title>Mi barbería — JPB</title>
<style>
  :root {
    --bg:#f4f1ec;--card:#fff;--border:#ebe5db;--text:#1b2430;--suave:#7a7468;
    --navy:#0f2236;--navy-2:#17324f;--laton:#b8893b;--laton-claro:#d9b26a;
    --ok:#1f8a5b;--ok-bg:#e8f4ee;--bad:#c0392b;--bad-bg:#f9e9e7;
    --warn:#8a672d;--warn-bg:#f6efe0;--sombra:0 1px 2px rgba(15,34,54,.04),0 10px 28px rgba(15,34,54,.06);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
  button,input,select,textarea{font:inherit;color:inherit}button{touch-action:manipulation}
  .app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
  aside{background:#fff;border-right:1px solid var(--border);padding:22px 16px;position:sticky;top:0;height:100vh}
  .marca{display:flex;align-items:center;gap:11px;padding:4px 8px 24px}.marca .logo,.login .logo{display:grid;place-items:center;background:var(--navy)}
  .marca .logo{width:42px;height:42px;border-radius:13px}.marca b{display:block;font:600 17px/1.15 "Playfair Display",serif;letter-spacing:-.01em}.marca small{color:var(--suave);font-size:11.5px}
  .nav-item{display:flex;align-items:center;gap:11px;width:100%;min-height:46px;padding:6px 10px;border:0;background:none;color:var(--suave);border-radius:12px;cursor:pointer;font-weight:600;margin-bottom:4px;text-align:left;transition:background-color .14s,color .14s}
  .nav-item .ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--bg);color:var(--navy)}
  .nav-item.activo{background:var(--navy);color:#fff}.nav-item.activo .ico{background:rgba(255,255,255,.11);color:#fff}
  main{min-width:0}header.top{background-color:var(--navy);background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.03) 0 1px,transparent 1px 14px);color:#fff;padding:24px 28px 66px;box-shadow:inset 0 -1px 0 rgba(184,137,59,.6)}
  .top-row{display:flex;align-items:center;justify-content:space-between;gap:12px}.top h1{margin:2px 0 0;font-size:28px;line-height:1.15;font-weight:700;letter-spacing:-.02em}.top .saludo{color:rgba(255,255,255,.72);font-size:13px}
  .top-acciones{display:flex;align-items:center;gap:10px}.avatar-top{width:42px;height:42px;border-radius:50%;background:#1a3857;color:#fff;display:grid;place-items:center;font-weight:700;border:2px solid var(--laton)}
  .contenido{position:relative;z-index:1;padding:0 24px 110px;margin-top:-40px}.contenido>section{max-width:1100px;margin:0 auto}
  .tarjeta{background:#fff;border:1px solid var(--border);border-radius:20px;box-shadow:var(--sombra);padding:18px}
  .titulo-seccion{display:flex;align-items:center;gap:9px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--suave);margin:24px 4px 11px}.titulo-seccion::before{content:"";width:16px;height:2px;border-radius:2px;background:var(--laton);flex:none}
  .grid-kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}.kpi{display:flex;align-items:center;gap:12px}.kpi .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}.kpi .val{font-size:26px;font-weight:700;line-height:1.08;letter-spacing:-.02em}.kpi .lbl{color:var(--suave);font-size:12.5px;margin-top:4px}
  .ic-navy{background:#e9eef3;color:var(--navy)}.ic-naranja,.ic-ambar{background:var(--warn-bg);color:var(--laton)}.ic-verde{background:var(--ok-bg);color:var(--ok)}.ic-rojo{background:var(--bad-bg);color:var(--bad)}
  .hero{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;text-align:center}.ring{display:flex;flex-direction:column;align-items:center;position:relative}.ring svg{width:112px;height:112px;transform:rotate(-90deg)}.ring .pista{fill:none;stroke:#ece7df;stroke-width:8}.ring .progreso{fill:none;stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset .14s ease}.ring-val{position:absolute;top:40px;font-size:22px;font-weight:700;letter-spacing:-.02em}.ring-lbl{margin-top:8px;font-size:13px;color:var(--suave);font-weight:600}
  .lista{display:flex;flex-direction:column;gap:8px}.item{display:flex;align-items:center;gap:12px;background:#fff;border-radius:16px;padding:12px 14px;box-shadow:var(--sombra);cursor:pointer;border:1px solid var(--border);transition:border-color .14s,transform .14s}.item:hover{border-color:#d9ccb7}.item:active{transform:scale(.99)}
  .circ{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;flex:none;font-size:15px}.item .info{min-width:0;flex:1}.item .nombre{font-weight:700;display:flex;gap:6px;flex-wrap:wrap;align-items:center}.item .detalle{color:var(--suave);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item .derecha{text-align:right;flex:none}.item .hora{color:var(--suave);font-size:12px}
  .pill{display:inline-block;font-size:11px;padding:4px 9px;border-radius:999px;font-weight:700}.pill.ok{background:var(--ok-bg);color:#176d48}.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.warn{background:var(--warn-bg);color:#745823}.pill.info{background:#e9eef3;color:var(--navy)}
  .btn{min-height:44px;background:linear-gradient(155deg,var(--navy-2),var(--navy));color:#fff;border:0;border-radius:14px;padding:10px 17px;cursor:pointer;font-weight:700;transition:filter .14s,transform .14s}.btn:hover{filter:brightness(1.08)}.btn:active{transform:scale(.98)}.btn.sec{background:#fff;color:var(--navy);border:1px solid var(--border)}.btn:disabled{opacity:.5;cursor:default}.btn.peq{min-height:38px;padding:7px 12px;font-size:12px}.vacio{text-align:center;color:var(--suave);padding:36px 10px}.vacio .empty-icon{width:48px;height:48px;border-radius:15px;background:#ebe7df;color:var(--navy);display:grid;place-items:center;margin:0 auto 12px}
  .hilo-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}.hilo-head .nombre-grande,.hoja .cab .nombre-grande{font-size:18px;font-weight:700;letter-spacing:-.02em}.hilo-head .tel{color:var(--suave);font-size:13px}.volver{min-height:44px;background:none;border:0;color:var(--navy);font-weight:700;cursor:pointer;padding:0 4px 10px}
  .chat{display:flex;flex-direction:column;gap:8px;padding:14px;background:#faf8f4;border:1px solid var(--border);border-radius:20px;box-shadow:var(--sombra);min-height:260px;max-height:60vh;overflow-y:auto}.burbuja{max-width:78%;padding:10px 14px;border-radius:18px 18px 18px 6px;background:#fff;border:1px solid var(--border);white-space:pre-wrap;overflow-wrap:anywhere}.burbuja.out{align-self:flex-end;background:#12304d;color:#fff;border-color:#12304d;border-radius:18px 18px 6px 18px}.burbuja.plantilla{background:#f6efe0;color:#5b4a22;border-color:#e8d5ac}.burbuja .hora-b{display:block;font-size:11px;opacity:.64;margin-top:4px;text-align:right}
  .dia-sep{align-self:center;font-size:11.5px;color:var(--suave);background:#ebe7df;padding:4px 12px;border-radius:999px;margin:6px 0 2px;font-weight:600}
  .bot-barra{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--border);border-radius:16px;padding:10px 12px;margin-bottom:10px;font-size:13.5px}.bot-barra .estado-icono{width:36px;height:36px;border-radius:11px;background:#e9eef3;color:var(--navy);display:grid;place-items:center;flex:none}.bot-barra .quien{flex:1;min-width:0}.bot-barra b{display:block;font-size:13.5px}.bot-barra small{color:var(--suave)}.bot-barra.humano{background:var(--warn-bg);border-color:#e8d5ac}.bot-barra.humano .estado-icono{background:#ead9b7;color:#6f5220}
  .redactor{margin-top:12px}.rapidas{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}.rapidas::-webkit-scrollbar,.chips::-webkit-scrollbar{display:none}.rapidas button,.chip{flex:none;min-height:44px;border:1px solid var(--border);background:#fff;border-radius:999px;padding:8px 14px;font-size:12.5px;color:var(--navy);font-weight:600;cursor:pointer}.redactor .fila-envio{display:flex;gap:10px;align-items:flex-end}.redactor textarea{flex:1;resize:none;border-radius:18px;border:1px solid var(--border);background:#fff;padding:12px 15px;min-height:48px;max-height:140px;font-size:15.5px}.redactor .enviar{width:48px;height:48px;border-radius:50%;border:0;background:var(--navy);color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 6px 16px rgba(15,34,54,.2);flex:none}.redactor .enviar:disabled,.redactor textarea:disabled{opacity:.5;cursor:default}
  input:focus,textarea:focus,.buscar:focus,.campo:focus{outline:2px solid rgba(184,137,59,.32);border-color:var(--laton)}
  .frase-card{position:relative;overflow:hidden;background-color:var(--navy);background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.03) 0 1px,transparent 1px 14px);color:#fff;border-radius:20px;padding:22px 24px 21px;margin-bottom:14px;box-shadow:0 12px 30px rgba(15,34,54,.18);cursor:pointer;border:1px solid rgba(217,178,106,.18)}.frase-card::after{content:"“";position:absolute;right:16px;top:-26px;font:500 96px/1 "Playfair Display",serif;color:rgba(184,137,59,.3);pointer-events:none}.frase-card .tag{position:relative;display:flex;align-items:center;gap:7px;letter-spacing:.14em;font-size:11px;font-weight:600;text-transform:uppercase;color:var(--laton-claro);margin-bottom:9px}.frase-card .txt{position:relative;font:italic 500 21px/1.4 "Playfair Display",serif;max-width:39ch;padding-right:24px}.frase-card .pie{position:relative;margin-top:10px;font-size:12px;color:rgba(255,255,255,.6)}
  .tabbar{display:none}.login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg)}.login{width:100%;max-width:390px;background:#fff;border:1px solid var(--border);border-radius:24px;padding:32px 28px;box-shadow:0 18px 52px rgba(15,34,54,.12);text-align:center}.login .logo{width:60px;height:60px;border-radius:18px;margin:0 auto 16px}.login h2{margin:0 0 6px;font:600 30px/1.2 "Playfair Display",serif;letter-spacing:-.02em}.login p{color:var(--suave);margin:0 0 18px;font-size:14px}.login input{width:100%;min-height:48px;padding:12px 14px;border-radius:14px;border:1px solid var(--border);background:#faf8f4;margin-bottom:12px}.login .btn{width:100%}.login .frase{margin:16px 5px 18px;font:italic 500 14px/1.5 "Playfair Display",serif;color:#625b50}.error{color:var(--bad);font-size:13px;min-height:18px;margin-top:8px}.oculto{display:none!important}
  .chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin:0 -2px 12px;scrollbar-width:none}.chip.activo{background:var(--navy);color:#fff;border-color:var(--navy)}.buscar{width:100%;min-height:48px;padding:12px 14px;border-radius:14px;border:1px solid var(--border);background:#fff;margin-bottom:12px}
  .meta-linea{margin:16px 0 4px}.meta-linea .fila{display:flex;justify-content:space-between;gap:12px;font-size:13px;font-weight:600;margin-bottom:7px}.meta-linea .fila span:last-child{color:var(--suave)}.barra{height:10px;border-radius:999px;background:#ece7df;overflow:hidden}.barra i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--laton),var(--laton-claro));transition:width .14s ease}.barra i.cumplida{background:var(--ok)}.meta-cumplida{display:flex;align-items:center;gap:6px;color:var(--ok);font-size:12.5px;font-weight:700;margin-top:7px}
  .semanas{display:flex;align-items:flex-end;gap:10px;height:110px;margin-top:6px}.semanas .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}.semanas .par{display:flex;align-items:flex-end;gap:3px;height:82px}.semanas .par i{width:12px;border-radius:5px 5px 2px 2px;min-height:3px;display:block}.semanas small{font-size:11px;color:var(--suave)}.leyenda{display:flex;gap:14px;font-size:12px;color:var(--suave);margin-top:8px}.leyenda b{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
  .canje-box{max-width:520px;margin:0 auto;text-align:center}.canje-icono{width:60px;height:60px;border-radius:18px;background:var(--warn-bg);color:var(--laton);display:grid;place-items:center;margin:0 auto 10px}.canje-box h2{margin:6px 0 5px;font-size:24px;letter-spacing:-.02em}.canje-box .campo{width:100%;padding:18px;font-size:22px;font-weight:700;letter-spacing:.04em;text-align:center;text-transform:uppercase;border-radius:18px;border:1px solid var(--border);background:#fff}.canje-box p{color:var(--suave);margin:4px 0 16px}
  .resultado{margin-top:16px;border-radius:18px;padding:18px;text-align:left}.resultado.ok{background:var(--ok-bg)}.resultado.bad{background:var(--bad-bg)}.resultado h3{margin:0 0 4px;font-size:18px}.resultado.ok h3{color:var(--ok)}.resultado.bad h3{color:var(--bad)}.resultado .desc{font-size:28px;font-weight:700;color:var(--ok);margin:6px 0}
  .fila-ciclo{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--border)}.fila-ciclo:first-of-type{border-top:0}.fila-ciclo .per{font-weight:700}.fila-ciclo .sub{color:var(--suave);font-size:12.5px}.fila-ciclo .monto{font-weight:700;text-align:right}.dato{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-top:1px solid var(--border)}.dato:first-of-type{border-top:0}.dato span:first-child{color:var(--suave)}
  .aviso,.aviso-ventana{background:var(--warn-bg);color:#5b4a22;border:1px solid #e8d5ac;border-radius:14px;padding:11px 14px;font-size:13px;margin-bottom:10px}.aviso{font-size:13.5px;margin-bottom:14px}
  .hoja-fondo{position:fixed;inset:0;background:rgba(15,34,54,.48);z-index:50;display:flex;align-items:flex-end;justify-content:center}.hoja{background:var(--bg);width:100%;max-width:520px;max-height:90vh;overflow-y:auto;border-radius:24px 24px 0 0;padding:20px 18px 28px;box-shadow:0 -10px 40px rgba(0,0,0,.18)}.hoja .cab{display:flex;align-items:center;gap:12px;margin-bottom:12px}.hoja .acc{display:flex;gap:8px;margin:14px 0 4px;flex-wrap:wrap}.linea-tiempo{border-left:2px solid var(--border);margin:12px 0 0 8px;padding-left:16px}.linea-tiempo .ev{position:relative;padding-bottom:14px;font-size:14px}.linea-tiempo .ev::before{content:"";position:absolute;left:-23px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--laton)}.linea-tiempo .ev.ok::before{background:var(--ok)}.linea-tiempo .ev.bad::before{background:var(--bad)}.linea-tiempo small{display:block;color:var(--suave)}
  #toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 18px;border-radius:999px;font-weight:600;z-index:80;opacity:0;pointer-events:none;transition:opacity .14s}#toast.on{opacity:1}
  #vista-chats>.titulo-seccion:first-child,#vista-chats>.volver:first-child{margin-top:66px}a.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
  @media(min-width:861px){.hoja-fondo{align-items:center}.hoja{border-radius:24px}}
  @media(max-width:860px){
    .app{grid-template-columns:1fr}aside{display:none}header.top{padding:19px 18px 58px}.top h1{font-size:24px}.contenido{padding:0 14px 110px}.tabbar{display:flex;position:fixed;bottom:10px;left:10px;right:10px;background:rgba(255,255,255,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(235,229,219,.9);border-radius:20px;box-shadow:0 10px 30px rgba(15,34,54,.16);padding:7px;padding-bottom:calc(7px + env(safe-area-inset-bottom));z-index:10}.tabbar button{flex:1;min-height:50px;border:0;background:none;color:var(--suave);padding:6px 3px;border-radius:14px;cursor:pointer;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}.tabbar button.activo{background:var(--navy);color:#fff}.hero{gap:4px}.ring svg{width:88px;height:88px}.ring-val{top:29px;font-size:18px}.ring-lbl{font-size:11.5px;text-align:center}.chat{max-height:52vh}.burbuja{max-width:86%}
    body.en-hilo .tabbar{display:none}body.en-hilo .contenido{padding-bottom:8px}body.en-hilo .hilo-wrap{display:flex;flex-direction:column;height:calc(100dvh - 98px);padding-bottom:env(safe-area-inset-bottom)}body.en-hilo .hilo-wrap>*{flex:none}body.en-hilo .hilo-wrap>.chat{flex:1 1 auto;min-height:90px;max-height:none}.hilo-wrap>.volver:first-child{margin-top:62px;align-self:flex-start}.redactor{padding-top:4px}.aviso-ventana{font-size:12.5px;padding:9px 12px}
  }
  @media(max-width:420px){.tarjeta{padding:16px}.contenido{padding-left:12px;padding-right:12px}.grid-kpi{grid-template-columns:1fr 1fr;gap:10px}.kpi{align-items:flex-start}.kpi .val{font-size:23px}.fila-ciclo{grid-template-columns:1fr auto}.fila-ciclo .pill{grid-column:2}.frase-card{padding:20px}.frase-card .txt{font-size:20px}}
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
  /* Ajustes finales */
  .item .nombre .pill{flex:none}
  body:not(.sesion) .tabbar{display:none!important}
  #vista-chats > .titulo-seccion:first-child{margin-top:44px}
  #vista-resumen > .frase-card:first-child{margin-top:46px}
</style>
</head>
<body>

<div id="login" class="login-wrap oculto">
  <div class="login">
    <div class="logo" data-polo="34"></div>
    <h2>Mi barbería</h2>
    <p>Ingresa tu clave de acceso para ver a tus clientes fidelizados.</p>
    <input id="clave" type="password" placeholder="Clave de acceso" autocomplete="current-password">
    <button id="entrar" class="btn">Entrar</button>
    <div class="frase" id="frase-login"></div>
    <div id="errorLogin" class="error"></div>
  </div>
</div>

<div id="app" class="app oculto">
  <aside>
    <div class="marca">
      <div class="logo" data-polo="26"></div>
      <div><b id="marca-nombre">Mi barbería</b><small>Programa de fidelización</small></div>
    </div>
    <button class="nav-item activo" data-vista="resumen"><span class="ico"></span>Resumen</button>
    <button class="nav-item" data-vista="clientes"><span class="ico"></span>Clientes</button>
    <button class="nav-item" data-vista="chats"><span class="ico"></span>Conversaciones</button>
    <button class="nav-item" data-vista="canjear"><span class="ico"></span>Canjear código</button>
    <button class="nav-item" data-vista="facturacion"><span class="ico"></span>Facturación</button>
    <button class="nav-item" id="salir" style="margin-top:18px"><span class="ico"></span>Cerrar sesión</button>
  </aside>

  <main>
    <header class="top">
      <div class="top-row">
        <div>
          <div class="saludo" id="saludo"></div>
          <h1 id="titulo">Resumen</h1>
        </div>
        <div class="top-acciones"><div class="avatar-top" id="avatar">B</div></div>
      </div>
    </header>

    <div class="contenido">
      <section id="vista-resumen"></section>
      <section id="vista-clientes" class="oculto"></section>
      <section id="vista-chats" class="oculto"></section>
      <section id="vista-canjear" class="oculto"></section>
      <section id="vista-facturacion" class="oculto"></section>
    </div>
  </main>
</div>

<nav class="tabbar" id="tabbar">
  <button data-vista="resumen" class="activo"><span class="ico"></span>Resumen</button>
  <button data-vista="clientes"><span class="ico"></span>Clientes</button>
  <button data-vista="chats"><span class="ico"></span>Chats</button>
  <button data-vista="canjear"><span class="ico"></span>Canjear</button>
  <button data-vista="facturacion"><span class="ico"></span>Cobros</button>
</nav>
<div id="toast"></div>

<script>
(() => {
  const CLAVE_KEY = "barberiaAcceso";
  const COLORES = ["#0f2236", "#b8893b", "#356b73", "#56647a", "#8a672d", "#1f8a5b", "#c0392b", "#315d85"];
  const TITULOS = { resumen: "Resumen", clientes: "Clientes", chats: "Conversaciones", canjear: "Canjear código", facturacion: "Facturación" };
  const $ = (id) => document.getElementById(id);
  let acceso = "";
  let yo = null;
  let vistaActual = "resumen";
  let clientes = [];
  let filtro = "todos";
  let busqueda = "";

  const ico = (nombre, tam = 20) =>
    `<svg width="${tam}" height="${tam}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONOS[nombre] || ""}</svg>`;
  const kpi = (icono, clase, valor, etiqueta) =>
    `<div class="tarjeta kpi"><div class="ic ${clase}">${ico(icono)}</div><div><div class="val">${escapar(valor)}</div><div class="lbl">${escapar(etiqueta)}</div></div></div>`;
  const ring = (pct, etiqueta, color) => {
    const r = 46, c = 2 * Math.PI * r;
    const off = c * (1 - Math.min(Math.max(pct, 0), 100) / 100);
    return `<div class="ring">
      <svg viewBox="0 0 112 112"><circle cx="56" cy="56" r="${r}" class="pista"/><circle cx="56" cy="56" r="${r}" class="progreso" stroke="${color}" stroke-dasharray="${c}" stroke-dashoffset="${off}"/></svg>
      <div class="ring-val">${Math.round(pct)}%</div>
      <div class="ring-lbl">${escapar(etiqueta)}</div>
    </div>`;
  };
  const metaLinea = (titulo, actual, meta, color) => {
    void color;
    const pct = meta ? Math.min(100, Math.round((actual / meta) * 100)) : 0;
    const cumplida = meta && actual >= meta;
    return `<div class="meta-linea"><div class="fila"><span>${escapar(titulo)}</span><span>${actual} de ${meta}</span></div><div class="barra"><i class="${cumplida ? "cumplida" : ""}" style="width:${pct}%"></i></div>${cumplida ? `<div class="meta-cumplida">${ico("check", 15)} Meta cumplida</div>` : ""}</div>`;
  };

  const SITUACION = {
    vigente: ["ok", "Vigente"], por_vencer: ["warn", "Por vencer"], canjeado: ["info", "Volvió"],
    vencido: ["bad", "Vencido"], cancelado: ["bad", "Canceló"],

  // ---------- API ----------
  async function api(ruta, metodo = "GET", cuerpo) {
    const r = await fetch("/api/" + ruta, {
      method: metodo,
      headers: { "x-acceso": acceso, ...(cuerpo ? { "content-type": "application/json" } : {}) },
      body: cuerpo ? JSON.stringify(cuerpo) : undefined,
    });
    const data = await r.json().catch(() => ({}));
    if (r.status === 401) { const e = new Error("Acceso incorrecto"); e.sesion = true; throw e; }
    if (!r.ok) { const e = new Error(data.error || "Error"); e.status = r.status; e.data = data; throw e; }
    return data;
  }

  // ---------- Vistas ----------

    const pctMetaCanjes = r.metas.canjes.meta ? (r.metas.canjes.actual / r.metas.canjes.meta) * 100 : 0;

      `<div class="col"><div class="par"><i style="height:${Math.max(4, (s.registros / maxS) * 100)}%;background:var(--navy)" title="${s.registros} registros"></i><i style="height:${Math.max(4, (s.canjes / maxS) * 100)}%;background:var(--laton)" title="${s.canjes} canjes"></i></div><small>${fechaIso(s.desde)}</small></div>`).join("");

        ${metaLinea("Meta del mes: clientes fidelizados", r.metas.clientes.actual, r.metas.clientes.meta, "#17874a")}
        ${metaLinea("Meta del mes: canjes", r.metas.canjes.actual, r.metas.canjes.meta, "#b8893b")}
      </div>

      <div class="titulo-seccion">Tus clientes</div>
      <div class="grid-kpi">
        ${kpi("users", "ic-navy", c.registrados, "Fidelizados")}

        ${kpi("hourglass", "ic-ambar", c.por_vencer, "Vencen en 7 días")}
        ${kpi("ticket", "ic-naranja", c.canjeados, "Ya volvieron")}
        ${kpi("ban", "ic-rojo", c.cancelados, "Cancelaron")}
      </div>

      <div class="titulo-seccion">Este mes</div>
      <div class="grid-kpi">
        ${kpi("userPlus", "ic-navy", c.nuevos_mes, "Clientes nuevos")}
        ${kpi("ticket", "ic-naranja", r.canjes.mes, "Canjes")}
        ${r.ventas_estimadas_mes != null ? kpi("coins", "ic-verde", clp(r.ventas_estimadas_mes), "Ventas por clientes que volvieron") : ""}
      </div>

      ${r.recordatorios || r.mensajes ? `<div class="titulo-seccion">Recordatorios y mensajes</div>
      <div class="grid-kpi">
        ${r.recordatorios ? kpi("bell", "ic-ambar", r.recordatorios.enviados_total, "Recordatorios enviados") : ""}
        ${r.recordatorios ? kpi("send", "ic-naranja", r.recordatorios.proximos_7d, "Por enviar en 7 días") : ""}
        ${r.mensajes ? kpi("message", "ic-navy", r.mensajes.conversaciones_mes, "Conversaciones este mes") : ""}
        ${r.mensajes ? kpi("message", "ic-verde", r.mensajes.recibidos_mes, "Mensajes de clientes") : ""}
      </div>` : ""}

      <div class="titulo-seccion">Últimas 6 semanas</div>

        <div class="semanas">${semanas}</div>

      </div>

      ${porVencer.length ? `<div class="titulo-seccion">Vencen pronto: motívalos a volver</div><div class="lista">${porVencer.map(itemCliente).join("")}</div>` : ""}
    `;
    enlazarItems();

  function itemCliente(c) {
    const nombre = c.nombre || "Sin nombre";
    const vence = c.canjeado_en ? `Canjeó el ${fechaMs(c.canjeado_en)}` : c.cancelado_en ? `Canceló el ${fechaMs(c.cancelado_en)}` : c.codigo_vence ? `Vence ${fechaMs(c.codigo_vence)}` : "";

      <div class="derecha">${pillSituacion(c.situacion)}</div>
    </div>`;
  }
  function enlazarItems() {
    document.querySelectorAll(".item[data-tel]").forEach((el) => el.onclick = () => abrirCliente(el.dataset.tel));
  }

  const FILTROS = [["todos", "Todos"], ["vigente", "Vigentes"], ["por_vencer", "Por vencer"], ["canjeado", "Volvieron"], ["vencido", "Vencidos"], ["cancelado", "Cancelaron"]];
  async function vistaClientes() {
    clientes = await api("clientes");
    const cont = $("vista-clientes");
    cont.innerHTML = `
      <input id="buscar" class="buscar" type="search" placeholder="Buscar por nombre, teléfono o código" value="${escapar(busqueda)}">
      <div class="chips" id="chips">${FILTROS.map(([k, t]) => `<button class="chip ${filtro === k ? "activo" : ""}" data-f="${k}">${t} · ${k === "todos" ? clientes.length : clientes.filter((c) => c.situacion === k).length}</button>`).join("")}</div>

  function pintarLista() {
    const q = busqueda.trim().toLowerCase();
    const l = clientes.filter((c) => (filtro === "todos" || c.situacion === filtro) &&

    $("lista-clientes").innerHTML = l.length ? l.map(itemCliente).join("") : `<div class="vacio"><div class="empty-icon">${ico("users", 23)}</div>${clientes.length ? "No hay clientes con ese filtro." : "Todavía no hay clientes fidelizados.<br>Aparecerán cuando escaneen el QR de tu barbería."}</div>`;

  function abrirCliente(tel) {
    const c = clientes.find((x) => x.telefono === tel);

    const puedeCanjear = c.situacion === "vigente" || c.situacion === "por_vencer";
    const eventos = [`<div class="ev">Se registró<small>${fechaMs(c.creado_en)}</small></div>`];
    if (c.recordatorios_enviados) eventos.push(`<div class="ev">Recibió ${c.recordatorios_enviados} recordatorio${c.recordatorios_enviados === 1 ? "" : "s"} por WhatsApp</div>`);
    if (c.canjeado_en) eventos.push(`<div class="ev ok">Volvió y canjeó su descuento<small>${fechaMs(c.canjeado_en)}</small></div>`);
    if (c.cancelado_en) eventos.push(`<div class="ev bad">Pidió no recibir más mensajes<small>${fechaMs(c.cancelado_en)}</small></div>`);
    if (c.situacion === "vencido") eventos.push(`<div class="ev bad">Su código venció sin usarse<small>${fechaMs(c.codigo_vence)}</small></div>`);
    abrirHoja(`
      <div class="cab"><div class="circ" style="background:${colorPara(c.telefono)}">${escapar(iniciales(c.nombre, c.telefono))}</div>

        <div class="dato"><span>Vence</span><b>${fechaMs(c.codigo_vence)}</b></div>
        <div class="dato"><span>Registro</span><b>${fechaMs(c.creado_en)}</b></div>

      </div>
      <div class="linea-tiempo">${eventos.join("")}</div>
      <div class="acc">
        <a class="btn sec" href="https://wa.me/${escapar(c.telefono)}" target="_blank" rel="noopener">WhatsApp</a>
        <button class="btn sec" id="h-chat">Ver chat</button>
        ${puedeCanjear ? `<button class="btn" id="h-canje">Marcar canje</button>` : ""}
        <button class="btn sec" id="h-cerrar">Cerrar</button>
      </div>`);
    $("h-cerrar").onclick = cerrarHoja;
    $("h-chat").onclick = () => { cerrarHoja(); abrirHilo(c.telefono); };
    const b = $("h-canje");
    if (b) b.onclick = async () => {
      if (!confirm(`¿Confirmas que ${c.nombre || "este cliente"} canjeó su ${yo.descuento_pct}% de descuento?`)) return;
      b.disabled = true;
      try { await api("clientes/canje", "POST", { telefono: c.telefono }); cerrarHoja(); toast("Canje registrado"); await mostrarVista(vistaActual); }
      catch (e) { toast(e.message); b.disabled = false; }
    };
  }
  function abrirHoja(html) {
    cerrarHoja();
    const f = document.createElement("div");
    f.className = "hoja-fondo"; f.id = "hoja";
    f.innerHTML = `<div class="hoja">${html}</div>`;
    f.addEventListener("click", (e) => { if (e.target === f) cerrarHoja(); });
    document.body.appendChild(f);
  }
  function cerrarHoja() { const h = $("hoja"); if (h) h.remove(); }

  function vistaCanjear() {
    $("vista-canjear").innerHTML = `
      <div class="canje-box tarjeta">
        <div class="canje-icono">${ico("ticket", 27)}</div>
        <h2>Canjear código</h2>
        <p>Pídele al cliente que te muestre su código (ej. <b>${escapar((yo.prefijo || "KEM"))}-JUAN-AB12</b>) y escríbelo aquí.</p>
        <input id="codigo" class="campo" placeholder="CÓDIGO" autocomplete="off" autocapitalize="characters" spellcheck="false">
        <button id="validar" class="btn" style="width:100%;padding:14px;margin-top:12px">Validar código</button>
        <div id="resultado"></div>
      </div>`;
    const input = $("codigo");
    const validar = async () => {
      const codigo = input.value.trim();
      if (!codigo) return;
      $("validar").disabled = true;
      try {
        const r = await api("codigo/validar", "POST", { codigo });
        $("resultado").innerHTML = `<div class="resultado ok"><h3>Código válido</h3>
          <div><b>${escapar(r.nombre || "Cliente")}</b> · ${escapar(r.codigo)}</div>
          <div class="desc">${r.descuento_pct}% de descuento</div>
          <div style="color:var(--suave);font-size:13px">Vence el ${fechaMs(r.vence)}</div>
          <button id="confirmar" class="btn" style="width:100%;margin-top:14px;padding:13px">Confirmar canje</button></div>`;
        $("confirmar").onclick = async () => {
          $("confirmar").disabled = true;
          try {
            await api("canjear", "POST", { codigo });
            $("resultado").innerHTML = `<div class="resultado ok"><h3>Canje registrado</h3><div>Aplica el ${r.descuento_pct}% a ${escapar(r.nombre || "tu cliente")}.</div></div>`;
            input.value = "";
          } catch (e) { $("resultado").innerHTML = `<div class="resultado bad"><h3>No se pudo canjear</h3><div>${escapar(e.message)}</div></div>`; }
        };
      } catch (e) {
        if (e.sesion) throw e;
        $("resultado").innerHTML = `<div class="resultado bad"><h3>Código no válido</h3><div>${escapar(e.message)}</div></div>`;
      } finally { $("validar").disabled = false; }
    };
    $("validar").onclick = validar;
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") validar(); });
    input.focus();
  }

  const ESTADO_CICLO = { pagado: ["ok", "Pagado"], pendiente: ["bad", "Pendiente"], en_curso: ["info", "En curso"] };
  async function vistaFacturacion() {
    const f = await api("facturacion");
    const p = f.plan;
    const aviso = !yo.tiene_plan ? `<div class="aviso">Tu plan todavía no está configurado. Tu ejecutivo de JPB Marketing lo cargará aquí.</div>` : "";
    $("vista-facturacion").innerHTML = `
      ${aviso}
      <div class="grid-kpi">
        ${kpi("wallet", f.deuda > 0 ? "ic-rojo" : "ic-verde", clp(f.deuda), f.deuda > 0 ? "Pendiente de pago" : "Sin deuda")}
        ${f.proximo_cobro ? kpi("calendar", "ic-navy", fechaIso(f.proximo_cobro.fecha), "Próximo cobro") : ""}
        ${f.proximo_cobro ? kpi("coins", "ic-naranja", clp(f.proximo_cobro.monto), "Monto estimado del ciclo") : ""}
      </div>
      <div class="titulo-seccion">Tu plan</div>
      <div class="tarjeta">
        <div class="dato"><span>Plan</span><b>${escapar(p.nombre)}</b></div>
        <div class="dato"><span>Valor por ciclo</span><b>${clp(p.precio_mensual)}</b></div>
        ${p.precio_canje ? `<div class="dato"><span>Por cada canje</span><b>${clp(p.precio_canje)}</b></div>` : ""}
        <div class="dato"><span>El ciclo parte el día</span><b>${p.dia_corte} de cada mes</b></div>
        <div class="dato"><span>Servicio desde</span><b>${p.inicio_servicio ? fechaIso(p.inicio_servicio, true) : "—"}</b></div>
      </div>
      <div class="titulo-seccion">Ciclos de cobro</div>
      <div class="tarjeta">${f.ciclos.length ? f.ciclos.map((c) => {
        const [cl, tx] = ESTADO_CICLO[c.estado] || ["warn", c.estado];
        return `<div class="fila-ciclo"><div><div class="per">${fechaIso(c.desde)} – ${fechaIso(c.hasta)}</div><div class="sub">${c.canjes} canje${c.canjes === 1 ? "" : "s"}${c.estado === "pagado" && c.pagado_en ? " · pagado el " + fechaMs(c.pagado_en) : ""}${c.nota ? " · " + escapar(c.nota) : ""}</div></div><div class="monto">${clp(c.monto)}</div><span class="pill ${cl}">${tx}</span></div>`;
      }).join("") : `<div class="vacio" style="padding:18px">Aún no hay ciclos de cobro.</div>`}</div>`;
  }


  // ---------- Conversaciones (las escribe el chatbot; aquí solo se leen) ----------
  let hiloTel = null;
  let refresco = null;
  const TZ = { timeZone: "America/Santiago" };
  const diaCL = (ts) => new Date(ts).toLocaleDateString("es-CL", TZ);
  const horaMs = (ts) => new Date(ts).toLocaleTimeString("es-CL", { ...TZ, hour: "2-digit", minute: "2-digit" });
  const tiempoMs = (ts) => {
    if (!ts) return "";
    const d = new Date(ts);
    return diaCL(ts) === diaCL(Date.now()) ? horaMs(ts) : d.toLocaleDateString("es-CL", { ...TZ, day: "numeric", month: "short" });
  };
  const diaEtiqueta = (ts) => {
    if (diaCL(ts) === diaCL(Date.now())) return "Hoy";
    if (diaCL(ts) === diaCL(Date.now() - 86400000)) return "Ayer";
    return new Date(ts).toLocaleDateString("es-CL", { ...TZ, weekday: "long", day: "numeric", month: "long" });
  };
  const detenerRefresco = () => { clearInterval(refresco); refresco = null; };

  async function vistaChats() {
    hiloTel = null;
    document.body.classList.remove("en-hilo");
    const lista = await api("conversaciones");
    $("vista-chats").innerHTML = lista.length ? `<div class="titulo-seccion" style="margin-top:4px">${lista.length >= 100 ? "Conversaciones recientes" : "Conversaciones con tu chatbot (" + lista.length + ")"}</div>
      <div class="lista">${lista.map((c) => {
        const nombre = c.nombre || "+" + c.telefono;
        const quien = c.ultimo_direccion === "out" ? "Bot: " : "";
        return `<div class="item" data-chat="${escapar(c.telefono)}">
          <div class="circ" style="background:${colorPara(c.telefono)}">${escapar(iniciales(c.nombre, c.telefono))}</div>
          <div class="info"><div class="nombre">${escapar(nombre)}${c.situacion ? " " + pillSituacion(c.situacion) : ""}${c.pausada ? ' <span class="pill warn">Atiendes tú</span>' : ""}</div>
            <div class="detalle">${escapar(quien + (c.ultimo_texto || ""))}</div></div>
          <div class="derecha"><div class="hora">${tiempoMs(c.ultimo_ts)}</div><div class="hora">${c.mensajes} msj</div></div>
        </div>`;
      }).join("")}</div>`
      : `<div class="vacio"><div class="empty-icon">${ico("message", 23)}</div>Todavía no hay conversaciones.<br>Aparecerán cuando alguien le escriba a tu chatbot de WhatsApp.</div>`;
    document.querySelectorAll("[data-chat]").forEach((el) => el.onclick = () => abrirHilo(el.dataset.chat));
    detenerRefresco();
    if (vistaActual !== "chats" || hiloTel) return; // cambiaste de pantalla mientras cargaba
    refresco = setInterval(() => { if (vistaActual === "chats" && !hiloTel && !document.hidden) vistaChats().catch(() => {}); }, 20000);
  }

  async function abrirHilo(tel) {
    hiloTel = tel;
    document.body.classList.add("en-hilo");
    if (vistaActual !== "chats") { vistaActual = "chats"; ["resumen", "clientes", "chats", "canjear", "facturacion"].forEach((v) => $("vista-" + v).classList.toggle("oculto", v !== "chats")); document.querySelectorAll("[data-vista]").forEach((b) => b.classList.toggle("activo", b.dataset.vista === "chats")); $("titulo").textContent = TITULOS.chats; }
    let armado = false;
    let irAlFondo = true;
    const RAPIDAS = [
      `¡Gracias por venir! 💈 Recuerda que tu código te da ${yo.descuento_pct}% en tu próximo corte.`,
      "Tu hora quedó confirmada ✅ Te esperamos.",
      "¿Cómo te fue con el corte? Tu opinión nos ayuda a mejorar 🙌",
    ];
    const dibujar = async () => {
      const d = await api("chat?telefono=" + encodeURIComponent(tel));
      if (hiloTel !== tel || vistaActual !== "chats") return;
      let ultimoDia = "";
      const burbujas = d.mensajes.map((m) => {
        const dia = diaCL(m.creado_en);
        const sep = dia !== ultimoDia ? `<div class="dia-sep">${escapar(diaEtiqueta(m.creado_en))}</div>` : "";
        ultimoDia = dia;
        const clase = m.direccion === "out" ? (m.tipo === "plantilla" ? "out plantilla" : "out") : "";
        return `${sep}<div class="burbuja ${clase}">${escapar(m.texto)}<span class="hora-b">${horaMs(m.creado_en)}</span></div>`;
      }).join("");
      const cont = $("vista-chats");
      if (!armado) {
        cont.innerHTML = `<div class="hilo-wrap"><button class="volver" id="volver-chats">← Conversaciones</button>
          <div class="hilo-head"><div class="circ" style="background:${colorPara(d.telefono)}">${escapar(iniciales(d.nombre, d.telefono))}</div>
            <div><div class="nombre-grande">${escapar(d.nombre || "Sin nombre")}</div><div class="tel">+${escapar(d.telefono)}${d.codigo ? " · " + escapar(d.codigo) : ""}</div></div>
            <div style="margin-left:auto" id="hilo-estado"></div></div>
          <div class="bot-barra" id="bot-barra"></div>
          <div class="chat" id="chat-caja"></div>
          <div class="redactor" id="redactor">
            <div id="aviso-ventana"></div>
            <div class="rapidas">${RAPIDAS.map((t, i) => `<button type="button" data-rapida="${i}">${escapar(t.length > 34 ? t.slice(0, 32) + "…" : t)}</button>`).join("")}</div>
            <div class="fila-envio"><textarea id="r-texto" rows="1" placeholder="Escribe tu respuesta por WhatsApp…" maxlength="1000"></textarea>
              <button class="enviar" id="r-enviar" aria-label="Enviar">${ico("send", 20)}</button></div>
          </div></div>`;
        $("volver-chats").onclick = () => { detenerRefresco(); vistaChats(); };
        const ta = $("r-texto");
        ta.addEventListener("input", () => { ta.style.height = "auto"; ta.style.height = Math.min(ta.scrollHeight, 140) + "px"; });
        ta.addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); enviar(); } });
        cont.querySelectorAll("[data-rapida]").forEach((b) => b.onclick = () => { ta.value = RAPIDAS[Number(b.dataset.rapida)]; ta.dispatchEvent(new Event("input")); ta.focus(); });
        $("r-enviar").onclick = enviar;
        armado = true;
      }
      $("hilo-estado").innerHTML = d.situacion ? pillSituacion(d.situacion) : "";
      $("bot-barra").className = "bot-barra" + (d.pausada ? " humano" : "");
      $("bot-barra").innerHTML = d.pausada
        ? `<div class="estado-icono">${ico("user", 19)}</div><div class="quien"><b>Atiendes tú</b><small>El chatbot está en pausa en esta conversación.</small></div><button class="btn sec peq" id="b-reactivar">Reactivar chatbot</button>`
        : `<div class="estado-icono">${ico("bot", 19)}</div><div class="quien"><b>El chatbot responde solo</b><small>Si le escribes tú, se pausa para no pisarte.</small></div>`;
      const r = $("b-reactivar");
      if (r) r.onclick = async () => { try { await api("pausa", "POST", { telefono: tel, pausar: false }); toast("Chatbot reactivado"); await dibujar(); } catch (e) { if (e.sesion) return cerrarSesion(); toast(e.message); } };
      const caja = $("chat-caja");
      const pegado = caja.scrollHeight - caja.scrollTop - caja.clientHeight < 80;
      const antes = caja.scrollTop;
      caja.innerHTML = burbujas || '<div class="vacio">Sin mensajes todavía.</div>';
      if (irAlFondo || pegado) caja.scrollTop = caja.scrollHeight; else caja.scrollTop = antes;
      irAlFondo = false;
      const abierta = d.ventana_abierta !== false;
      $("aviso-ventana").innerHTML = abierta ? "" : `<div class="aviso-ventana">Pasaron más de 24 h desde el último mensaje de este cliente. WhatsApp no permite escribirle hasta que él responda.</div>`;
      $("r-texto").disabled = !abierta; $("r-enviar").disabled = !abierta;
    };
    async function enviar() {
      const ta = $("r-texto"), btn = $("r-enviar");
      const texto = ta.value.trim();
      if (!texto || btn.disabled) return;
      btn.disabled = true;
      try {
        await api("responder", "POST", { telefono: tel, texto });
        ta.value = ""; ta.style.height = "auto"; irAlFondo = true;
        toast("Mensaje enviado");
        await dibujar();
        ta.focus();
      } catch (e) { if (e.sesion) return cerrarSesion(); toast(e.message); }
      finally { btn.disabled = false; }
    }
    try {
      await dibujar();
      if (vistaActual !== "chats" || hiloTel !== tel) return; // saliste del chat mientras cargaba
      window.scrollTo(0, 0);
      detenerRefresco();
      refresco = setInterval(() => { if (hiloTel === tel && vistaActual === "chats" && !document.hidden) dibujar().catch(() => {}); }, 8000);
    } catch (e) { if (e.sesion) return cerrarSesion(); toast(e.message); vistaChats(); }
  }

  // ---------- Navegación ----------
  async function mostrarVista(nombre) {
    vistaActual = nombre;
    document.body.classList.remove("en-hilo");
    if (nombre !== "chats") { detenerRefresco(); hiloTel = null; }
    ["resumen", "clientes", "chats", "canjear", "facturacion"].forEach((v) => $("vista-" + v).classList.toggle("oculto", v !== nombre));
    document.querySelectorAll("[data-vista]").forEach((b) => b.classList.toggle("activo", b.dataset.vista === nombre));
    $("titulo").textContent = TITULOS[nombre];
    window.scrollTo(0, 0);
    try {
      await { resumen: vistaResumen, clientes: vistaClientes, chats: vistaChats, canjear: async () => vistaCanjear(), facturacion: vistaFacturacion }[nombre]();
    } catch (e) {
      if (e.sesion) return cerrarSesion();
      $("vista-" + nombre).innerHTML = `<div class="vacio">No se pudo cargar. ${escapar(e.message)}</div>`;
    }
  }

  async function mostrarApp() {
    yo = await api("yo");
    $("login").classList.add("oculto");
    document.body.classList.add("sesion");
    $("app").classList.remove("oculto");
    $("marca-nombre").textContent = yo.nombre;
    $("saludo").textContent = `${saludo()}, ${yo.nombre}`;
    $("avatar").textContent = iniciales(yo.nombre, "B");
    document.title = `${yo.nombre} — JPB`;
    await mostrarVista("resumen");
  }
  function cerrarSesion() {
    try { localStorage.removeItem(CLAVE_KEY); } catch (e) {}
    acceso = "";
    location.reload();
  }

  $("entrar").addEventListener("click", async () => {
    acceso = $("clave").value.trim();
    $("errorLogin").textContent = "";
    if (!acceso) return;
    try { await mostrarApp(); try { localStorage.setItem(CLAVE_KEY, acceso); } catch (e) {} }
    catch (e) { acceso = ""; $("errorLogin").textContent = e.sesion ? "Clave incorrecta" : "No se pudo conectar"; }
  });
  $("clave").addEventListener("keydown", (e) => { if (e.key === "Enter") $("entrar").click(); });
  document.querySelectorAll("[data-vista]").forEach((b) => b.addEventListener("click", () => mostrarVista(b.dataset.vista)));
  $("salir").addEventListener("click", cerrarSesion);

  const ICONOS_NAV = { resumen: "chart", clientes: "users", chats: "message", canjear: "ticket", facturacion: "wallet" };
  document.querySelectorAll("[data-vista] .ico").forEach((el) => { el.innerHTML = ico(ICONOS_NAV[el.parentElement.dataset.vista], 18); });
  $("salir").querySelector(".ico").innerHTML = ico("logout", 18);

  decorar();
  $("frase-login").textContent = "“" + fraseDelDia() + "”";
  let guardado = "";
  try { guardado = localStorage.getItem(CLAVE_KEY) || ""; } catch (e) {}
  if (guardado) { acceso = guardado; mostrarApp().catch(() => { acceso = ""; $("login").classList.remove("oculto"); }); }
  else $("login").classList.remove("oculto");

  if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
})();

</script>
</body>
</html>
